version: '3.8'

services:
  rbp-framework:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rbp-api-automation
    ports:
      - "3000:3000"
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PROJECT=demo-rbp
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
